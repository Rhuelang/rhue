[package]
name = "rhue-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Language server for Rhue: diagnostics, completion, hover, navigation, refactors and inlay hints"
readme = "README.md"
keywords = ["rhue", "lsp", "language-server"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
rhue = { workspace = true, features = ["tooling"] }
rhue-common.workspace = true
rhue-fmt.workspace = true
lsp-server = "0.10"
lsp-types = "0.95"
serde = "1"
serde_json = "1"
url = "2"

[[bin]]
name = "rhue-lsp"
path = "src/main.rs"

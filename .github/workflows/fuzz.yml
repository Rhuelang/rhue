name: fuzz

# a few minutes on each fuzz target every night. a crash fails the run and
# leaves the input as an artifact, see fuzz/README.md for reproducing it

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [compile, load, patterns, run]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz
      - name: Fuzz
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          seeds=""
          if [ "${{ matrix.target }}" = compile ] || [ "${{ matrix.target }}" = run ]; then
            seeds="examples bench"
          fi
          cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} $seeds -- -max_total_time=300 -timeout=10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

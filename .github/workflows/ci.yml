name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --all-features --locked
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Examples
        shell: bash
        run: |
          for example in hello sandbox modules tasks embed async_host hot_reload; do
            echo "::group::$example"
            cargo run --locked -p rhue --example "$example"
            echo "::endgroup::"
          done
      # Every benchmark script states its expected results; one run each
      # checks that optimisations haven't changed behaviour.
      - name: Benchmark results
        run: cargo run --release --locked -p rhue --example bench -- --runs 1

  lint:
    name: Format, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-features --locked

  # instruction counts from callgrind, which don't drift like wall times do.
  # fails if a benchmark gets more than 2% worse than bench/counts.json
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bench/compare
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Instruction counts
        run: bench/counts.sh --check
      # its own workspace, so nothing else builds it
      - name: Build the Luau/Rhai comparison
        run: cargo build --release --locked --manifest-path bench/compare/Cargo.toml

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories
          manifest-path: bench/compare/Cargo.toml

  package:
    name: Package for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds every crate from its packaged sources, in dependency order.
      - name: Package
        run: cargo package --workspace --locked

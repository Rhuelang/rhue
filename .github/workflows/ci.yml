name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --all-features --locked
      - name: Test
        run: cargo test --workspace --all-features --locked
      # rhue on its own, without the features the rest of the workspace turns on
      - name: Test rhue with default features
        run: cargo test -p rhue --locked
      - name: Examples
        shell: bash
        run: |
          for example in hello sandbox modules tasks embed async_host hot_reload; do
            echo "::group::$example"
            cargo run --locked -p rhue --example "$example"
            echo "::endgroup::"
          done
      # Every benchmark script states its expected results; one run each
      # checks that optimisations haven't changed behaviour.
      - name: Benchmark results
        run: cargo run --release --locked -p rhue --example bench -- --runs 1

  lint:
    name: Format, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-features --locked

  # callgrind instruction counts for the base commit and this one, on the same
  # runner since counts change between machines. fails if a benchmark got more
  # than 2% worse
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bench/compare
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Counts for the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no base commit to compare with"
            exit 0
          fi
          git worktree add -q ../base "$BASE"
          if [ ! -x ../base/bench/counts.sh ]; then
            echo "the base doesn't have counts.sh yet"
            exit 0
          fi
          ../base/bench/counts.sh --save "$RUNNER_TEMP/base.json"
      - name: Instruction counts
        run: |
          if [ -f "$RUNNER_TEMP/base.json" ]; then
            bench/counts.sh --check "$RUNNER_TEMP/base.json"
          else
            bench/counts.sh
          fi
      # its own workspace, so nothing else builds it
      - name: Build the Luau/Rhai comparison
        run: cargo build --release --locked --manifest-path bench/compare/Cargo.toml

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories
          manifest-path: bench/compare/Cargo.toml

  package:
    name: Package for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds every crate from its packaged sources, in dependency order.
      - name: Package
        run: cargo package --workspace --locked

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # one PR for minor and patch bumps instead of one per crate. a minor bump
      # of a 0.x crate can break things, CI catches those
      minor:
        update-types: [minor, patch]
    ignore:
      # 18 and up need a newer Rust than our 1.88 (File::lock, cfg_select!).
      # drop this when the MSRV goes up
      - dependency-name: rustyline
        versions: [">=18"]

  - package-ecosystem: cargo
    directory: /bench/compare
    schedule:
      interval: monthly
    groups:
      everything:
        patterns: ["*"]

  # also keeps the pinned commit hashes current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
